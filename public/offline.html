<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171412">
    <title>MyHEP — Offline</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0f0e0d; color: #f8f5f2; }
        main { width: min(100%, 520px); padding: 32px; border: 1px solid #393330; border-radius: 20px; background: #171412; text-align: center; }
        h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 6vw, 2.25rem); }
        p { margin: 0; color: #c9c1bb; line-height: 1.6; }
        button { margin-top: 24px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 999px; background: #f0a45d; color: #21150c; font: inherit; font-weight: 700; cursor: pointer; }
        button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>You’re offline</h1>
        <p>MyHEP cannot reach the server right now. Check your connection, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
