<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">StudentEdge wide student dashboard concept</title>
  <desc id="desc">A dark wide dashboard with an alert strip, a two-column student welcome panel, six account summary cards, and four portal cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17130f"/><stop offset=".54" stop-color="#0d0d0d"/><stop offset="1" stop-color="#12100e"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d3929"/><stop offset=".55" stop-color="#241d18"/><stop offset="1" stop-color="#181513"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d39a"/><stop offset="1" stop-color="#ad7b32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1300" cy="130" r="360" fill="#ad7b32" opacity=".07"/>
  <circle cx="250" cy="700" r="310" fill="#e5c18a" opacity=".04"/>

  <rect x="0" y="0" width="1600" height="82" fill="#100f0e"/>
  <text x="70" y="34" fill="#bcae9b" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CURRENT PAGE</text>
  <text x="70" y="59" fill="#f7efe8" font-family="Arial, sans-serif" font-size="24" font-weight="700">Student Dashboard</text>
  <rect x="1450" y="21" width="54" height="42" rx="14" fill="#29231e" stroke="#5a4938"/>
  <text x="1470" y="49" fill="#f0d39a" font-family="Arial, sans-serif" font-size="20">&#9834;</text>

  <g filter="url(#shadow)">
    <rect x="140" y="122" width="1320" height="66" rx="18" fill="#26221c" stroke="#896b37"/>
    <circle cx="178" cy="155" r="17" fill="url(#gold)"/>
    <text x="173" y="161" fill="#241a10" font-family="Arial, sans-serif" font-size="18" font-weight="700">i</text>
    <text x="214" y="150" fill="#f7e7cb" font-family="Arial, sans-serif" font-size="15" font-weight="700">Complete Scholarship Data Form</text>
    <text x="214" y="171" fill="#c9baa7" font-family="Arial, sans-serif" font-size="13">Submit your status form to keep your aid information current.</text>
    <rect x="1340" y="137" width="94" height="36" rx="12" fill="url(#gold)"/>
    <text x="1361" y="160" fill="#251b10" font-family="Arial, sans-serif" font-size="13" font-weight="700">Fill form</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="140" y="212" width="1320" height="214" rx="26" fill="url(#hero)" stroke="#5c4a38"/>
    <text x="178" y="258" fill="#d8b37b" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">STUDENTEDGE</text>
    <text x="178" y="306" fill="#fff8ef" font-family="Georgia, serif" font-size="36">Welcome, AINA SYAFIQAH</text>
    <text x="178" y="334" fill="#c7b6a3" font-family="Arial, sans-serif" font-size="15">34DIT26F1011  &#183;  DIT</text>
    <rect x="178" y="360" width="105" height="36" rx="18" fill="#ffffff" opacity=".08"/>
    <text x="199" y="383" fill="#f3d8a9" font-family="Arial, sans-serif" font-size="13" font-weight="700">View profile</text>

    <rect x="960" y="244" width="432" height="150" rx="20" fill="#ffffff" opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
    <g font-family="Arial, sans-serif">
      <text x="990" y="273" fill="#a79a8a" font-size="11" font-weight="700" letter-spacing="1">ACADEMIC DETAILS</text>
      <text x="990" y="306" fill="#f7efe8" font-size="16" font-weight="700">Session</text><text x="1092" y="306" fill="#d9b87f" font-size="16" font-weight="700">I: 2026/2027</text>
      <text x="990" y="338" fill="#f7efe8" font-size="16" font-weight="700">Class</text><text x="1092" y="338" fill="#d9b87f" font-size="16" font-weight="700">DIT</text>
      <text x="990" y="370" fill="#f7efe8" font-size="16" font-weight="700">Semester</text><text x="1092" y="370" fill="#d9b87f" font-size="16" font-weight="700">1</text>
      <text x="1218" y="306" fill="#a79a8a" font-size="11" font-weight="700" letter-spacing="1">TODAY</text>
      <text x="1218" y="335" fill="#f7efe8" font-size="15" font-weight="700">Aug 09, 2026</text>
      <text x="1218" y="366" fill="#d9b87f" font-size="15" font-weight="700">05:11 AM</text>
    </g>
  </g>

  <text x="140" y="470" fill="#cdbba4" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ACCOUNT SUMMARY</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g fill="#181513" stroke="#514334">
      <rect x="140" y="488" width="205" height="112" rx="18"/><rect x="363" y="488" width="205" height="112" rx="18"/><rect x="586" y="488" width="205" height="112" rx="18"/><rect x="809" y="488" width="205" height="112" rx="18"/><rect x="1032" y="488" width="205" height="112" rx="18"/><rect x="1255" y="488" width="205" height="112" rx="18"/>
    </g>
    <g fill="#b98a3e"><circle cx="169" cy="518" r="11"/><circle cx="392" cy="518" r="11"/><circle cx="615" cy="518" r="11"/><circle cx="838" cy="518" r="11"/><circle cx="1061" cy="518" r="11"/><circle cx="1284" cy="518" r="11"/></g>
    <g fill="#aaa095" font-size="12" font-weight="700"><text x="157" y="552">OFFENSES</text><text x="380" y="552">UNPAID FINES</text><text x="603" y="552">ACTIVE AID</text><text x="826" y="552">PAYMENT APPS</text><text x="1049" y="552">STICKER</text><text x="1272" y="552">CAMPUS STATUS</text></g>
    <g fill="#fff7ef" font-size="27" font-weight="700"><text x="157" y="581">0</text><text x="380" y="581">0</text><text x="603" y="581">0</text><text x="826" y="581">0</text><text x="1049" y="581">NONE</text><text x="1272" y="581">INSIDE</text></g>
  </g>

  <text x="140" y="650" fill="#cdbba4" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">MAIN PORTAL</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g stroke="#514334"><rect x="140" y="668" width="315" height="170" rx="22" fill="#2d261d"/><rect x="475" y="668" width="315" height="170" rx="22" fill="#32241f"/><rect x="810" y="668" width="315" height="170" rx="22" fill="#24211d"/><rect x="1145" y="668" width="315" height="170" rx="22" fill="#202620"/></g>
    <g fill="#f1ce8f"><circle cx="177" cy="704" r="16"/><circle cx="512" cy="704" r="16"/><circle cx="847" cy="704" r="16"/><circle cx="1182" cy="704" r="16"/></g>
    <g fill="#fff7ef" font-size="17" font-weight="700"><text x="166" y="748">Scholarship &amp; Aid</text><text x="501" y="748">Offense &amp; Fines</text><text x="836" y="748">Student Profile</text><text x="1171" y="748">Campus Movement</text></g>
    <g fill="#c6b6a5" font-size="13"><text x="166" y="777">Aid records, applications, and</text><text x="166" y="797">new announcements.</text><text x="501" y="777">Fine status, history, and payment</text><text x="501" y="797">requests.</text><text x="836" y="777">Personal details and account</text><text x="836" y="797">security.</text><text x="1171" y="777">Entry, exit, scan QR, and history.</text></g>
  </g>
</svg>
